					<div style="margin-top: 10px; font-size: 88%;"><p>Back in 2004 while at ThoughtWorks I made the original Selenium 1 with Jason Huggins and open sourced it.
It is now a defacto standard (at version 3), and a multi-million dollar industry. Selenium has
<a target="_blank" rel="noopener" href="http://www.seleniumhq.org">its own portal</a>.</p>

<p>In 2014 I wrote ThoughtWorks'    "10-year old birthday congratulations for Selenium" [<a target="_blank" rel="noopener" href="https://www.thoughtworks.com/insights/blog/happy-10th-birthday-selenium">link</a>].</p>
</div>

					<h3>My Blogging</h3>
					<div style="margin-top: 10px; font-size: 88%;"><p>I've blogged continually from 2002 onwards. Always on matters related to software development. I alternate
between build-time and run-time concerns. Most often, my style is pundit. I have quite often been early
into technologies that would go on to move the industry, and in a few cases been one of the innovators.</p>

					<div style="margin-top: 10px; font-size: 88%;"><p>Branch by Abstraction instead of Branch by Source Control!</p>

<p><a target="_blank" rel="noopener" href="https://branchbyabstraction.com/">See the resource site I put together on it </a>. Well, perhaps I did not invent it as such,
but I was the first to document it in 2007.</p>

<p>Industry luminary Martin Fowler <a target="_blank" rel="noopener" href="https://martinfowler.com/bliki/BranchByAbstraction.html">wrote an article too</a> and links back to mine.
As does Jez Humble with <a target="_blank" rel="noopener" href="https://continuousdelivery.com/2011/05/make-large-scale-changes-incrementally-with-branch-by-abstraction/">"Make Large Scale Changes Incrementally with Branch By Abstraction"</a>.</p>

<p>The pic above is from a <a target="_blank" rel="noopener" href="https://trunkbaseddevelopment.com/branch-by-abstraction">page I wrote for the TrunkBasedDevelopment.com website</a>.</p>
</div>

					<h3>PicoContainer Co-Creator</h3>
					<div style="margin-top: 10px; font-size: 88%;"><p>I have been active in Apache's Avalon Framework project from 2000, but in 2003 pivoted
with Aslak Hellesøy (more famous for Cucumber these days) towards another take on "Inversion of Control" to use constructors for
dependencies, and made PicoContainer (<a target="_blank" rel="noopener" href="http://picocontainer.com/">website</a>)
for the Java community to use. It is still used today in the industry leading IDEs that JetBrains make.</p>

<p>I am guilty of <a target="_blank" rel="noopener" href="http://www2.sys-con.com/itsg/virtualcd/java/archives/0812/hammant/index.html">defining some numerical sub-types for IoC</a>,
before ThoughtWorks' chief scientist, Martin Fowler,
wrote his widely-read article renaming what I was talking about to Dependency Injection (DI)</p>
</div>
